<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#22396f">
<title>Krida Karandak Results</title>
<meta name="description" content="Results, schedule and points for MES Krida Karandak 2026–27.">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mukta:wght@400;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="field" aria-hidden="true"></div>
<header class="top wrap">
  <div class="host">
    <img class="crest" src="/logos/school.webp" width="400" height="411" alt="Maharashtra Education Society, Pune">
    <p class="school">Adyakrantiveer Vasudev Balwant Phadke Vidyalaya, <span>New Panvel</span></p>
  </div>
  <div class="words">
    <h1>Krida Karandak <span>2026–27</span></h1>
    <p class="when">22 to 24 January 2027</p>
  </div>
  <img class="viru" src="/logos/viru.webp" width="593" height="1000" alt="Viru the running tiger, the Krida Karandak mascot">
</header>
<nav class="glass" aria-label="Sections" data-i="0">
  <i class="lens" aria-hidden="true"></i>
  <a href="#results">Results</a>
  <a href="#schedule">Schedule</a>
  <a href="#points">Points</a>
  <a href="#info">Info</a>
</nav>
<main class="wrap" id="main">
  <p class="note" id="status" role="status">Loading…</p>
  <div id="view"></div>
</main>
<footer class="wrap">
  <p>A result appears here after two different people have checked it. A child's name is shown only if a parent agreed; otherwise it says “Participant”.</p>
</footer>
<noscript><p class="wrap note">Please turn on JavaScript to see the results.</p></noscript>
<script type="module" src="/app.mjs"></script>
<script type="module" src="/glass.mjs"></script>
</body>
</html>
